<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Modern Tech Gradients -->
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="favLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062f2" />
      <stop offset="100%" stop-color="#003bb5" />
    </linearGradient>
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#258cfb" />
      <stop offset="100%" stop-color="#0056d6" />
    </linearGradient>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f38" />
      <stop offset="100%" stop-color="#040924" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0062f2" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)" stroke="rgba(0, 98, 242, 0.4)" stroke-width="1.5" />

  <!-- Clean Isometric Nexus Box / Cube Logo -->
  <g transform="translate(10, 10)" filter="url(#favGlow)">
    <!-- Top Isometric Face -->
    <path d="M 22 3 L 39 12.8 L 22 22.6 L 5 12.8 Z" fill="url(#favTop)" />
    <!-- Left Isometric Face -->
    <path d="M 5 14.5 L 21 23.8 L 21 42.5 L 5 33.2 Z" fill="url(#favLeft)" />
    <!-- Right Isometric Face -->
    <path d="M 23 23.8 L 39 14.5 L 39 33.2 L 23 42.5 Z" fill="url(#favRight)" />
    <!-- Central Core Highlight Node -->
    <circle cx="22" cy="22.6" r="3.2" fill="#ffffff" />
    <circle cx="22" cy="22.6" r="1.8" fill="#00f2fe" />
  </g>
</svg>
